# TAKT - Ansible Inventory: Production
all:
  hosts:
    prod.takt.local:
      ansible_user: deploy
      ansible_ssh_private_key_file: ~/.ssh/id_ed25519
  vars:
    takt_env: prod
    takt_compose_file: infra/docker-compose.yml
    takt_env_file: infra/.env.prod
    takt_compose_override: infra/docker-compose.prod.yml
    takt_registry: ghcr.io
    takt_repository_owner: mdichm
    takt_image_tag: latest
    takt_postgres_user: takt_prod
    takt_postgres_password_file: /run/secrets/postgres_password
    takt_postgres_db: takt_prod
    takt_jwt_secret_file: /run/secrets/jwt_secret
    takt_jwt_refresh_secret_file: /run/secrets/jwt_refresh_secret
    takt_smtp_host: cck.rnu.tn
    takt_smtp_port: 587
    takt_smtp_secure: false
    takt_smtp_user_file: /run/secrets/smtp_user
    takt_smtp_pass_file: /run/secrets/smtp_pass
    takt_smtp_from_file: /run/secrets/smtp_from
    takt_smtp_from_name: TAKT
    takt_app_url: https://takt.local
    takt_nginx_ports:
      - "443:443"
    takt_api_replicas: 3
    takt_worker_replicas: 1