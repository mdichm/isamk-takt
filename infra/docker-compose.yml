# TAKT - Development Environment Docker Compose
# Usage: docker compose -f infra/docker-compose.yml up -d

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy (TLS termination, rate limiting)
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: .
      dockerfile: nginx.Dockerfile
      target: runner
    container_name: takt-nginx-dev
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # TLS certificates - mount from host in production
      - ./certs:/etc/nginx/certs:ro
      # ACME challenge for Let's Encrypt
      - certbot_webroot:/var/www/certbot
    networks:
      - frontend
      - backend
    depends_on:
      - web
      - api
    restart: unless-stopped
    profiles:
      - proxy

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: takt-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-takt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-takt_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-takt_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
      - filestore_data:/filestore:ro
    # Port only exposed for direct access in dev (remove in production)
    # ports:
    #   - "5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-takt} -d ${POSTGRES_DB:-takt_dev}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # API - NestJS Backend
  # ---------------------------------------------------------------------------
  api:
    image: ${REGISTRY}/${REPOSITORY_OWNER}/takt-api:${IMAGE_TAG:-latest}
    container_name: takt-api-dev
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-takt}:${POSTGRES_PASSWORD:-takt_dev_password}@postgres:5432/${POSTGRES_DB:-takt_dev}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_in_production}
      SMTP_HOST: ${SMTP_HOST:-cck.rnu.tn}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_FILE: ${SMTP_FROM_FILE:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-TAKT}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # OpenTelemetry - traces vers Tempo
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4317
    volumes:
      # Mount source for hot reload in dev (override in docker-compose.override.yml)
      - ../apps/api/src:/app/src:ro
      - ../packages:/app/packages:ro
      # FileStore : seule interface d'acces aux fichiers (volume sur disque chiffre en production)
      - filestore_data:/filestore
    # Port not exposed directly - accessed via nginx on frontend network
    # ports:
    #   - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          require('http').get('http://localhost:3000/health', (r) => {if(r.statusCode!==200) process.exit(1)})
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - frontend
      - backend
      - smtp
      - observability
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Web - Next.js Frontend
  # ---------------------------------------------------------------------------
  web:
    image: ${REGISTRY}/${REPOSITORY_OWNER}/takt-web:${IMAGE_TAG:-latest}
    container_name: takt-web-dev
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_URL: https://localhost/api
    # Port not exposed directly - accessed via nginx on frontend network
    # ports:
    #   - "3001:3000"
    depends_on:
      - api
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          require('http').get('http://localhost:3000', (r) => {if(r.statusCode!==200) process.exit(1)})
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - frontend
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Worker - pg-boss Job Processor
  # ---------------------------------------------------------------------------
  worker:
    image: ${REGISTRY}/${REPOSITORY_OWNER}/takt-worker:${IMAGE_TAG:-latest}
    container_name: takt-worker-dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-takt}:${POSTGRES_PASSWORD:-takt_dev_password}@postgres:5432/${POSTGRES_DB:-takt_dev}?schema=public
      # OpenTelemetry - traces vers Tempo
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4317
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - observability
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Observabilité - Prometheus
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: takt-prometheus-dev
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - observability
    restart: unless-stopped
    profiles:
      - monitoring

  # ---------------------------------------------------------------------------
  # Observabilité - Grafana
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana-oss:12.0.0
    container_name: takt-grafana-dev
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - observability
    restart: unless-stopped
    profiles:
      - monitoring

  # ---------------------------------------------------------------------------
  # Observabilité - Loki (agrégation des logs)
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.1.0
    container_name: takt-loki-dev
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - observability
    restart: unless-stopped
    profiles:
      - monitoring

  # ---------------------------------------------------------------------------
  # Observabilité - Tempo (traces OpenTelemetry)
  # ---------------------------------------------------------------------------
  tempo:
    image: grafana/tempo:2.5.0
    container_name: takt-tempo-dev
    command: -config.file=/etc/tempo/tempo-config.yml
    volumes:
      - ./observability/tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempo_data:/tempo
    networks:
      - observability
    restart: unless-stopped
    profiles:
      - monitoring

  # ---------------------------------------------------------------------------
  # Observabilité - Alertmanager (routing des alertes Prometheus)
  # ---------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: takt-alertmanager-dev
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - observability
    restart: unless-stopped
    profiles:
      - monitoring

  # ---------------------------------------------------------------------------
  # pgAdmin (optional - for database management)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: takt-pgadmin-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@takt.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    # Port only exposed for dev tools profile
    # ports:
    #   - "5050:80"
    depends_on:
      - postgres
    networks:
      - backend
    restart: unless-stopped
    profiles:
      - tools

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  certbot_webroot:
    driver: local
  filestore_data:
    driver: local
    # Volume dedie pour le FileStore (fichiers moteur, sorties FET, exports, logos).
    # En production, ce volume doit etre sur un disque chiffre (LUKS).
    # C'est la seule interface d'acces aux fichiers (pas d'autre volume de fichiers expose).
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  tempo_data:
    driver: local
  alertmanager_data:
    driver: local

# -----------------------------------------------------------------------------
# Networks (Isolation per security requirements)
# -----------------------------------------------------------------------------
networks:
  frontend:     # Nginx ↔ Web (port 3000)
    driver: bridge
    internal: false  # Port 443/80 exposed via nginx
    name: takt-frontend

  backend:      # Nginx ↔ API ↔ Worker ↔ PostgreSQL ↔ pg-boss
    driver: bridge
    internal: true   # No external exposure
    name: takt-backend

  smtp:         # API → SMTP externe (seule sortie)
    driver: bridge
    internal: false  # Allows egress to cck.rnu.tn:587
    name: takt-smtp

  observability: # Prometheus, Grafana, Loki, Tempo
    driver: bridge
    internal: true   # Monitoring internal only
    name: takt-observability
