# Destination : .github/workflows/ci.yml
#
# - Pull request vers main (hors brouillons) : validation, tests, scans, build Docker de contrôle.
# - Push sur main / tags v*             : validation ET build des images en parallèle,
#                                         puis promotion (latest/main) et déploiement dev
#                                         seulement si tout est vert.
# - Push de branche sans PR             : rien n'est lancé.
# Le job "CI gate" est le SEUL check à déclarer comme requis dans le ruleset de main.

name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.cline/**'
      - '.clinerules/**'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  # ===========================================================================
  # Détection des changements (PR uniquement ; push/tags/manuel = tout lancer)
  # ===========================================================================
  changes:
    name: Detect changes
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      integration: ${{ steps.filter.outputs.integration }}
      docker: ${{ steps.filter.outputs.docker }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Classify changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            {
              echo "code=true"
              echo "integration=true"
              echo "docker=true"
              echo "docs=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')"
          echo "Changed files:"
          echo "$files"

          any() {
            if grep -Eq "$1" <<< "$files"; then echo true; else echo false; fi
          }

          # "code" = tout ce qui n'est pas uniquement documentation / maintenance.
          # Un fichier inconnu déclenche donc la CI (échec sûr).
          noncode='^(docs/|\.cline/|\.clinerules/|\.github/(dependabot\.yml|PULL_REQUEST_TEMPLATE|ISSUE_TEMPLATE))|\.md$|^LICENSE'
          code=false
          if [ -n "$files" ] && grep -Evq "$noncode" <<< "$files"; then
            code=true
          fi

          {
            echo "code=$code"
            echo "integration=$(any '^(apps/api/|packages/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$|\.github/(workflows|actions)/)')"
            echo "docker=$(any '(^|/)Dockerfile$|^infra/|^\.dockerignore$|^pnpm-lock\.yaml$|^\.github/(workflows|actions)/')"
            echo "docs=$(any '^docs/|^\.github/(workflows|actions)/')"
          } >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Validate: lint, typecheck, build
  # ===========================================================================
  validate:
    name: Validate
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/takt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Generate Prisma Client (db package)
        run: pnpm prisma generate
        working-directory: ./packages/db

      - name: Generate Prisma Client (api package)
        run: pnpm db:generate
        working-directory: ./apps/api

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run build
        run: pnpm build

  # ===========================================================================
  # Unit tests
  # ===========================================================================
  test:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Factice : Prisma se construit avec l'adapter pg sans se connecter ;
      # les tests unitaires mockent PrismaService et ne queryent jamais la base.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/takt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Run tests
        run: pnpm test

  # ===========================================================================
  # Integration tests (Testcontainers PostgreSQL) : seulement si api/db/packages changent
  # ===========================================================================
  test-integration:
    name: Integration Tests
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Generate Prisma Client
        run: pnpm db:generate
        working-directory: ./apps/api

      - name: Run integration tests
        run: pnpm test:integration
        working-directory: ./apps/api
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'

  # ===========================================================================
  # Security: audit des dépendances + Trivy FS (PR et main)
  # ===========================================================================
  security:
    name: Security Scans
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm (no install needed for audit)
        uses: ./.github/actions/setup-node-pnpm
        with:
          install: 'false'

      - name: Audit dependencies (critical)
        run: pnpm audit --audit-level=critical

      - name: Audit dependencies (moderate — SAST)
        run: pnpm audit --audit-level=moderate || true

      - name: Run Trivy vulnerability scanner (FS)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      # continue-on-error : à retirer une fois l'onglet Security vérifié (dépôt public).
      - name: Upload Trivy FS results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-fs.sarif
          category: filesystem

  # ===========================================================================
  # Docker build de contrôle sur PR (sans push), si Dockerfile / infra / lockfile changent
  # ===========================================================================
  docker-check:
    name: Docker build (${{ matrix.app }})
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, worker]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.app }} (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          platforms: linux/amd64

  # ===========================================================================
  # Cohérence du backlog : les artefacts versionnés doivent correspondre à tickets_data.py
  # (le XLSX n'est pas comparé : ses octets changent à chaque génération)
  # ===========================================================================
  backlog:
    name: Backlog consistency
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install openpyxl
        run: python -m pip install openpyxl

      - name: Regenerate backlog artifacts
        run: |
          python3 docs/tools/build_backlog.py
          python3 docs/tools/verifier_coherence.py
          python3 docs/tools/velocity_tracker.py

      - name: Verify regeneration succeeded
        run: |
          test -f dist/Backlog_TAKT_tickets.csv && \
          test -f dist/VELOCITE.md && \
          test -f dist/TRACABILITE_TAKT.md && \
          test -f dist/correspondance_tickets.json && \
          echo "Backlog artifacts regenerated successfully in dist/"

  # ===========================================================================
  # CI gate : seul check requis par le ruleset de main
  # ===========================================================================
  ci-gate:
    name: CI gate
    needs: [changes, validate, test, test-integration, security, docker-check, backlog]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*)
              echo "::error::At least one job failed or was cancelled"
              exit 1
              ;;
          esac

  # ===========================================================================
  # Build & push des images (main et tags uniquement)
  # ===========================================================================
  # Lancé en parallèle de la validation : il ne pousse que des tags immuables
  # (sha-xxxxxxx, semver). Les tags mobiles latest/main ne sont posés qu'après
  # validation, dans deploy-dev (étape "Promote tested images").
  build-and-push:
    name: Build & Push (${{ matrix.app }})
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, worker]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for ${{ matrix.app }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/takt-${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=TAKT ${{ matrix.app }} service
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build and push ${{ matrix.app }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          platforms: linux/amd64
          provenance: true
          sbom: true

      # Scan de l'image exacte qui vient d'être poussée (digest), pas du tag :main.
      - name: Trivy container scan for ${{ matrix.app }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/takt-${{ matrix.app }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.app }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-${{ matrix.app }}.sarif
          category: ${{ matrix.app }}

  # ===========================================================================
  # Deploy dev : automatique sur push main uniquement
  # ===========================================================================
  deploy-dev:
    name: Deploy Dev
    needs: [validate, test, test-integration, security, build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: development
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Toute la validation est verte : on déplace latest et main vers l'image testée.
      - name: Promote tested images (latest, main)
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          sha_tag="sha-${GITHUB_SHA::7}"
          for app in api web worker; do
            image="${REGISTRY}/${OWNER}/takt-${app}"
            docker buildx imagetools create \
              --tag "${image}:latest" \
              --tag "${image}:main" \
              "${image}:${sha_tag}"
          done

      - name: Deploy to dev
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          PROJECT_NAME: takt
          IMAGE_TAG: latest
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
        run: |
          chmod +x ./infra/deploy-dev.sh
          ./infra/deploy-dev.sh "${IMAGE_TAG}" --no-build --pull

  # ===========================================================================
  # Spike S1 : validation empirique FET 7.12.0 (manuel, workflow_dispatch)
  # ===========================================================================
  spike-s1:
    name: Spike S1 – FET 7.12.0
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build FET 7.12.0 image
        run: docker build -t fet-cl:7.12.0 -f Dockerfile.fet-cl .
      - name: Run spike tests (T0-T5)
        run: |
          docker run --rm -v ${{ github.workspace }}/docs:/work fet-cl:7.12.0 \
            /work/s1_fet_tests.sh /opt/fet/bin/fet-cl /work/isamk.fet /work/s1-work
      - name: Upload spike report
        uses: actions/upload-artifact@v4
        with:
          name: s1-report
          path: docs/s1-work/report.md
