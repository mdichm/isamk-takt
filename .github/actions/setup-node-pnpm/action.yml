# Destination : .github/actions/setup-node-pnpm/action.yml
# Source unique de la version de Node utilisée par la CI.
# Garder alignée avec "engines.node" de package.json.
name: Setup Node.js and pnpm
description: Install pnpm and Node.js (with pnpm cache) and, optionally, the workspace dependencies

inputs:
  install:
    description: Run "pnpm install --frozen-lockfile"
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: ${{ inputs.install == 'true' && 'pnpm' || '' }}

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
